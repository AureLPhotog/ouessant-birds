<meta property="og:locale:alternate" content="en_GB">

<!-- Icônes et raccourci sur l'écran d'accueil -->
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">

</head>
<body>
<div class="wrap">
  <header>
    <button type="button" class="phare-btn" id="phareBtn" aria-expanded="false" aria-controls="pharePanel" aria-label="Météo et partage" title="Météo et partage"><img class="phare" src="phare_creach.svg" alt="" width="56" height="131"></button>
    <div class="intro">
      <h1 data-t="title">Oiseaux d'Ouessant</h1>
      <p class="lede">Tape le nom d'une espèce pour savoir sur quel canal annoncer ton observation.</p>
    </div>
    <div id="pharePanel" class="phare-panel" hidden></div>
    <div class="tools">
      <button type="button" id="prefsBtn" class="prefs-btn" aria-expanded="false" aria-controls="prefsPanel">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2a10 10 0 0 0 0 20z" fill="currentColor"/></svg>
        <span class="sr" data-t="prefsLabel">Affichage</span>
      </button>
      <div class="lang" role="group" aria-label="Langue / Language">
        <button type="button" data-lang="fr" aria-pressed="true">FR</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <div id="prefsPanel" class="prefs" hidden>
        <p class="prefs-t" data-t="themeLabel">Thème</p>
        <div class="seg" role="group" data-pref="theme">
          <button type="button" data-v="auto" data-t="tAuto">Auto</button>
          <button type="button" data-v="light" data-t="tLight">Clair</button>
          <button type="button" data-v="dark" data-t="tDark">Sombre</button>
        </div>
        <p class="prefs-t" data-t="colorsLabel">Couleurs</p>
        <div class="seg" role="group" data-pref="cvd">
          <button type="button" data-v="0" data-t="cStd">Standard</button>
          <button type="button" data-v="1" data-t="cCvd">Daltonisme</button>
        </div>
        <p class="prefs-n" data-t="cvdNote"></p>
      </div>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Menu">
    <button type="button" role="tab" id="tab-btn-birds" aria-controls="tab-birds" aria-selected="true" data-tab="birds" data-t="tabBirds">Oiseaux</button>
    <button type="button" role="tab" id="tab-btn-places" aria-controls="tab-places" aria-selected="false" data-tab="places" data-t="tabPlaces">Lieux</button>
    <button type="button" role="tab" id="tab-btn-where" aria-controls="tab-where" aria-selected="false" data-tab="where" data-t="tabWhere">Où suis-je ?</button>
  </nav>

  <section id="tab-birds" role="tabpanel" aria-labelledby="tab-btn-birds">
  <div class="search" role="search">
    <div class="field">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
      <input id="q" type="search" enterkeyhint="search" autocomplete="off" spellcheck="false" placeholder="" aria-label="" disabled>
      <button id="clear" type="button" hidden data-t="clear">Effacer</button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Filtrer par canal de diffusion"></div>
    <div class="opts"><label><input type="checkbox" id="ssp" checked> <span data-t="showSsp">Afficher les sous-espèces</span></label></div>
  </div>

  <div id="notice" aria-live="polite"></div>
  <p class="status" id="status" aria-live="polite"></p>
  <div id="results"></div>

  <a id="newBirdBtn" class="sbtn" href="editeur.html?fichier=oiseaux&amp;nouveau=" data-t="newBird">Proposer un nouvel oiseau</a>

  <div class="foot">
    <span id="source"></span>
  </div>
  </section>

  <section id="tab-places" role="tabpanel" aria-labelledby="tab-btn-places" hidden>
    <div class="search" role="search">
      <div class="field">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>
        <input id="pq" type="search" enterkeyhint="search" autocomplete="off" spellcheck="false" placeholder="" aria-label="">
        <button id="pclear" type="button" hidden data-t="clear">Effacer</button>
      </div>
    </div>
    <p class="ptip" data-t="locTip"></p>
    <p class="maplink"><a href="Map_Ouessant.pdf" target="_blank" rel="noopener"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg><span data-t="openIslandMap">Ouvrir la carte de l'île (PDF)</span></a></p>
    <a id="newBtn" class="sbtn" href="editeur.html?fichier=lieux&amp;nouveau=" data-t="newPlace">Proposer un nouveau lieu-dit</a>
    <p class="status" id="pstatus" aria-live="polite"></p>
    <div id="presults"></div>
    <p class="pnote" data-t="placesNote"></p>
  </section>

  <section id="tab-where" role="tabpanel" aria-labelledby="tab-btn-where" hidden>
    <button type="button" id="locate" class="locate"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7.5"/></svg><span data-t="locateBtn">Me localiser</span></button>
    <p class="status" id="wstatus" aria-live="polite"></p>
    <div id="wresults"></div>
    <button type="button" id="shareLoc" class="locate alt" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="M8.3 10.8l7.4-4.4M8.3 13.2l7.4 4.4"/></svg><span data-t="shareLocBtn">Partager ma position</span></button>
    <div id="wmap" class="pmap" hidden></div>
    <p class="ptip" data-t="locTip"></p>
    <p class="pnote" data-t="whereNote"></p>
  </section>
</div>

<script src="js/textes.js"></script>
<script src="js/carte.js"></script>
<script src="js/recherche.js"></script>
<script src="js/version.js"></script>
<script src="js/appli.js"></script>
</body>
</html>

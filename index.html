<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oiseaux d'Ouessant · canal de diffusion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,700;1,400;1,500&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fuse.js@6.4.6/dist/fuse.min.js"></script>
<style>
:root{
  --ocean:#1F3A4D; --ocean-2:#2C5168; --foam:#EEF2F0; --paper:#FFFFFF;
  --granite:#5E676B; --line:#D3DAD8; --heather:#8C5E83; --warn:#B4532A; --warn-bg:#FBEFE8;
  --ink:#16232C;
  --serif:"Spectral", Georgia, "Times New Roman", serif;
  --sans:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ocean:#9FC3D9; --ocean-2:#7FAAC4; --foam:#0F1B23; --paper:#16252F;
    --granite:#9AA6AB; --line:#2A3B46; --heather:#C9A1C0; --warn:#F0A07A; --warn-bg:#3A2219; --ink:#E6EEF0;
  }
}
:root[data-theme="dark"]{
  --ocean:#9FC3D9; --ocean-2:#7FAAC4; --foam:#0F1B23; --paper:#16252F;
  --granite:#9AA6AB; --line:#2A3B46; --heather:#C9A1C0; --warn:#F0A07A; --warn-bg:#3A2219; --ink:#E6EEF0;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--foam);color:var(--ink);font:400 16px/1.5 var(--sans)}
.wrap{max-width:860px;margin:0 auto;padding:0 1.25rem 4rem}

/* En-tête : bande rayée du phare du Créac'h */
header{display:flex;gap:1.1rem;align-items:stretch;padding:2.25rem 0 1.5rem}
.phare{flex:0 0 14px;border-radius:2px;
  background:repeating-linear-gradient(180deg,var(--ink) 0 16px,var(--paper) 16px 32px);
  border:1px solid var(--ink)}
header{position:relative}
.lang{position:absolute;top:2.25rem;right:0;display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper)}
.lang button{border:0;background:none;color:var(--granite);font:600 .82rem var(--sans);padding:.35rem .75rem;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ocean);color:var(--foam)}
.intro h1{padding-right:6.5rem}
h1{font:700 clamp(2rem,6vw,3.1rem)/1.02 var(--serif);margin:0;color:var(--ocean);letter-spacing:-.01em}
.lede{margin:.6rem 0 0;color:var(--granite);max-width:52ch}

/* Recherche */
.search{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--foam);padding:.75rem 0 .6rem}
.field{display:flex;align-items:center;background:var(--paper);border:2px solid var(--ocean);border-radius:12px;padding:0 .5rem 0 1rem}
.field svg{flex:0 0 auto;color:var(--ocean)}
#q,#pq{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:500 1.15rem var(--sans);padding:.85rem .7rem;outline:none}
#q::-webkit-search-cancel-button,#pq::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
#q::placeholder,#pq::placeholder{color:var(--granite);font-weight:400}
#clear,#pclear{border:0;background:none;color:var(--granite);font:500 .9rem var(--sans);padding:.5rem .6rem;cursor:pointer;border-radius:8px}
#clear[hidden],#pclear[hidden]{display:none}
.field:focus-within{box-shadow:0 0 0 4px color-mix(in srgb,var(--ocean) 25%,transparent)}

.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.7rem 0 .15rem;scrollbar-width:thin}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);color:var(--ink);
  font:500 .9rem var(--sans);padding:.4rem .8rem;border-radius:999px;cursor:pointer;display:flex;gap:.45rem;align-items:center}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip .n{color:var(--granite);font-weight:400}
.chip[aria-pressed="true"]{background:var(--ocean);border-color:var(--ocean);color:var(--foam)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.8}

button:focus-visible,.chip:focus-visible,label.btn:focus-within{outline:3px solid var(--heather);outline-offset:2px}

/* Messages */
.notice{margin:1rem 0 0;padding:1rem 1.1rem;border-left:4px solid var(--warn);background:var(--warn-bg);border-radius:0 10px 10px 0}
.notice strong{color:var(--warn)}
.notice p{margin:0}
.status{color:var(--granite);font-size:.92rem;margin:1rem 0 .4rem}

/* Résultats */
ul.list{list-style:none;margin:0;padding:0;background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:.2rem 1rem;align-items:center;padding:.85rem 1.1rem;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.fr{font:600 1.08rem/1.25 var(--sans)}
.sci{grid-column:1;font:italic 400 1rem/1.3 var(--serif);color:var(--granite)}
.en{grid-column:1;font:400 .9rem/1.3 var(--sans);color:var(--granite)}
.tag{display:inline-block;margin-left:.45rem;padding:.05rem .45rem;border:1px solid var(--line);border-radius:6px;
  font:500 .72rem/1.5 var(--sans);color:var(--granite);vertical-align:.12em;white-space:nowrap}
.opts{display:flex;align-items:center;gap:.5rem;padding:.55rem 0 0;font-size:.9rem;color:var(--granite)}

.opts[hidden]{display:none}
.opts label{display:flex;align-items:center;gap:.5rem;cursor:pointer}
.opts input{width:1.05rem;height:1.05rem;accent-color:var(--ocean);margin:0}
.canal{grid-row:1 / span 3;grid-column:2;justify-self:end;display:flex;align-items:center;gap:.45rem;
  font:600 .88rem var(--sans);padding:.35rem .7rem;border-radius:8px;background:var(--foam);text-align:right}
.canal .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
mark{background:color-mix(in srgb,var(--heather) 22%,transparent);color:inherit;border-radius:3px;padding:0 .05em}

/* État vide / import */
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:1.6rem 1.3rem;text-align:left}
.empty h2{font:700 1.35rem var(--serif);color:var(--ocean);margin:0 0 .4rem}
.empty p{margin:.2rem 0 1rem;color:var(--granite);max-width:60ch}
.btn{display:inline-flex;align-items:center;gap:.5rem;background:var(--ocean);color:var(--foam);border:0;border-radius:10px;
  font:600 .95rem var(--sans);padding:.7rem 1.1rem;cursor:pointer}
.btn input{position:absolute;width:1px;height:1px;opacity:0}
/* Onglets */
.tabs{display:flex;gap:.25rem;border-bottom:1px solid var(--line);margin:0 0 .25rem}
.tabs button{border:0;background:none;color:var(--granite);font:600 1rem var(--sans);padding:.6rem .9rem;cursor:pointer;
  border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ocean);border-bottom-color:var(--ocean)}
.tabs button:focus-visible{outline:3px solid var(--heather);outline-offset:-3px}
section[hidden]{display:none}

/* Lieux */
.place{padding:.9rem 1.1rem;border-top:1px solid var(--line)}
.place:first-child{border-top:0}
.place h3{margin:0;font:600 1.08rem/1.25 var(--sans)}
.place{cursor:pointer}
.ptitle{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:.4rem}
.ptitle::after{content:"";width:.5rem;height:.5rem;border-right:2px solid var(--granite);border-bottom:2px solid var(--granite);
  transform:rotate(45deg) translateY(-2px);transition:transform .15s}
.ptitle[aria-expanded="true"]::after{transform:rotate(-135deg) translate(-2px,-1px)}
.ptitle:focus-visible{outline:3px solid var(--heather);outline-offset:3px;border-radius:4px}
.pmap{margin:.75rem 0 .2rem}
.pmap[hidden]{display:none}
.pmap canvas{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:var(--foam)}
.pmap p{margin:.35rem 0 0;font-size:.82rem;color:var(--granite)}
.pmap .err{color:var(--warn)}
.suggest{margin-top:.7rem}
.sbtn,.sgps,.scheck{border:1px solid var(--line);background:var(--paper);color:var(--ink);font:600 .88rem var(--sans);padding:.45rem .8rem;border-radius:8px;cursor:pointer}
.sbtn{background:none;color:var(--ocean-2);border-style:dashed}
.sform{margin-top:.6rem;padding:.8rem;border:1px solid var(--line);border-radius:10px;background:var(--foam);display:grid;gap:.6rem}
.sform[hidden]{display:none}
.sform label{display:grid;gap:.25rem;font-size:.85rem;color:var(--granite)}
.sform input,.sform textarea{font:400 1rem var(--sans);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:.5rem .6rem;width:100%;box-sizing:border-box}
.sform p{margin:0;font-size:.88rem}
.sform .shelp{color:var(--granite)}
.sform .good{color:#1F7A5A;font-weight:600}
.sform .bad{color:var(--warn);font-weight:600}
.sform .snote{color:var(--granite);font-size:.8rem;margin-top:.3rem}
.smail{display:inline-block;margin-top:.4rem;background:var(--ocean);color:var(--foam);font:600 .9rem var(--sans);padding:.55rem .9rem;border-radius:8px;text-decoration:none}
.sbtn:focus-visible,.sgps:focus-visible,.scheck:focus-visible,.smail:focus-visible,.sform input:focus-visible,.sform textarea:focus-visible{outline:3px solid var(--heather);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.ptitle::after{transition:none}}
.place .grid{color:var(--granite);font-size:.9rem;margin:.1rem 0 .5rem}
.coords{font:500 1rem/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;color:var(--ink)}
.coords small{display:block;font:400 .85rem/1.4 var(--sans);color:var(--granite)}
.prec{font-size:.85rem;color:var(--granite);margin:.25rem 0 .6rem}
.prec.exact{color:var(--ocean-2);font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:.5rem}
.actions a,.actions button{display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--line);background:var(--foam);
  color:var(--ink);font:600 .88rem var(--sans);padding:.45rem .8rem;border-radius:8px;cursor:pointer;text-decoration:none}
.actions a:focus-visible,.actions button:focus-visible{outline:3px solid var(--heather);outline-offset:2px}
.ptip{margin:.9rem 0 0;padding:.7rem 1rem;border-left:4px solid var(--ocean);background:var(--paper);border-radius:0 10px 10px 0;font-weight:600;color:var(--ink)}
.maplink{margin:.7rem 0 0}
.maplink a{display:inline-flex;align-items:center;gap:.45rem;color:var(--ocean-2);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.maplink a:focus-visible{outline:3px solid var(--heather);outline-offset:2px;border-radius:4px}
.pnote{margin-top:1.5rem;color:var(--granite);font-size:.85rem;max-width:62ch}
.foot{margin-top:2rem;color:var(--granite);font-size:.85rem;display:flex;flex-wrap:wrap;gap:.4rem 1rem;align-items:center}
.link{background:none;border:0;padding:0;color:var(--ocean-2);text-decoration:underline;font:inherit;cursor:pointer}
.link input{position:absolute;width:1px;height:1px;opacity:0}

@media (max-width:520px){
  .row{grid-template-columns:1fr}
  .canal{grid-row:auto;grid-column:1;justify-self:start;margin-top:.35rem}
}
@media (prefers-reduced-motion:no-preference){
  .row{animation:in .18s ease-out both}
  @keyframes in{from{opacity:0}to{opacity:1}}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="phare" aria-hidden="true"></div>
    <div class="intro">
      <h1 data-t="title">Oiseaux d'Ouessant</h1>
      <p class="lede">Tape le nom d'une espèce pour savoir sur quel canal annoncer ton observation sur l'île.</p>
    </div>
    <div class="lang" role="group" aria-label="Langue / Language">
      <button type="button" data-lang="fr" aria-pressed="true">FR</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Menu">
    <button type="button" role="tab" id="tab-btn-birds" aria-controls="tab-birds" aria-selected="true" data-tab="birds" data-t="tabBirds">Oiseaux</button>
    <button type="button" role="tab" id="tab-btn-places" aria-controls="tab-places" aria-selected="false" data-tab="places" data-t="tabPlaces">Lieux</button>
  </nav>

  <section id="tab-birds" role="tabpanel" aria-labelledby="tab-btn-birds">
  <div class="search" role="search">
    <div class="field">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
      <input id="q" type="search" enterkeyhint="search" autocomplete="off" spellcheck="false" placeholder="" aria-label="" disabled>
      <button id="clear" type="button" hidden data-t="clear">Effacer</button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Filtrer par canal de diffusion"></div>
    <div class="opts"><label><input type="checkbox" id="ssp" checked> <span data-t="showSsp">Afficher les sous-espèces</span></label></div>
  </div>

  <div id="notice" aria-live="polite"></div>
  <p class="status" id="status" aria-live="polite"></p>
  <div id="results"></div>

  <div class="foot">
    <span id="source"></span>
    <label class="link"><span data-t="importOther">Importer un autre fichier JSON</span><input type="file" accept=".json,application/json" class="fileInput"></label>
  </div>
  </section>

  <section id="tab-places" role="tabpanel" aria-labelledby="tab-btn-places" hidden>
    <div class="search" role="search">
      <div class="field">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>
        <input id="pq" type="search" enterkeyhint="search" autocomplete="off" spellcheck="false" placeholder="" aria-label="">
        <button id="pclear" type="button" hidden data-t="clear">Effacer</button>
      </div>
    </div>
    <p class="ptip" data-t="locTip"></p>
    <p class="maplink"><a href="Map_Ouessant.pdf" target="_blank" rel="noopener"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg><span data-t="openIslandMap">Ouvrir la carte de l'île (PDF)</span></a></p>
    <p class="status" id="pstatus" aria-live="polite"></p>
    <div id="presults"></div>
    <p class="pnote" data-t="placesNote"></p>
  </section>
</div>

<script>
(function(){
  const URL_DATA = 'https://raw.githubusercontent.com/AureLPhotog/ouessant-birds/refs/heads/main/ouessant_birds.json';
  const K_FR = 'Nom Français', K_SCI = 'Nom Scientifique', K_EN = 'Nom Anglais', K_TYPE = 'Type de taxon', K_CANAL = 'Proposition de Canal de Diffusion Ouessant';
  const STORE = 'ouessant-birds-data', LANG_KEY = 'ouessant-birds-lang';

  const I18N = {

      placeholder: 'Nom français, scientifique ou anglais',
      searchLabel: 'Rechercher une espèce',
      clear: 'Effacer', all: 'Toutes', showSsp: 'Afficher les sous-espèces', ssp: 'sous-espèce',
      channelsLabel: 'Filtrer par canal de diffusion',
      loading: 'Chargement de la liste des espèces…',

      gpsErr: 'Position GPS indisponible. Autorise la localisation ou colle des coordonnées.',

    en: {

  let lang = 'fr';
  try { lang = localStorage.getItem(LANG_KEY) || ''; } catch(_) {}
  if (!I18N[lang]) lang = (navigator.language || 'fr').toLowerCase().startsWith('fr') ? 'fr' : 'en';
  const T = k => I18N[lang][k];

  let submitted = false;
  let birds = [], fuse = null, channels = [], counts = {}, activeChannel = null, colorOf = {}, sourceKey = null, showingImport = false;

  const $ = id => document.getElementById(id);
  const q = $('q'), results = $('results'), notice = $('notice'), status = $('status'), chips = $('chips'), clearBtn = $('clear'), sspBox = $('ssp');

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const norm = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
  const isSsp = b => norm(b[K_TYPE]).startsWith('sous');

  // Le canal reste stocké tel quel dans les données ; seul son libellé est traduit.
  function canalOf(b){ return (b[K_CANAL] || '').trim() || '—'; }
  function canalLabel(c){
    const n = norm(c);
    const ch = I18N[lang].channels;
    if (n.startsWith('tele')) return ch.telegram;
    if (n.startsWith('whats')) return ch.whatsapp;
    if (n.startsWith('pas') || n === 'xx_non') return ch.none;
    if (c === '—') return ch.unknown;
    return c;
  }
  // Nom principal selon la langue (repli sur le français si l'anglais manque)
  const mainName = b => (lang === 'en' && b[K_EN]) ? b[K_EN] : b[K_FR];
  const altName  = b => lang === 'en' ? b[K_FR] : b[K_EN];

  function highlight(text, query){
    const t = String(text ?? '');
    if(!query) return esc(t);
    const i = norm(t).indexOf(norm(query));
    if(i < 0) return esc(t);
    return esc(t.slice(0,i)) + '<mark>' + esc(t.slice(i, i+query.length)) + '</mark>' + esc(t.slice(i+query.length));
  }

  function applyLang(){
    document.documentElement.lang = lang;
    document.title = T('docTitle');
    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = T(el.dataset.t); });
    document.querySelector('.lede').innerHTML = T(tab === 'places' ? 'ledePlaces' : 'lede');
    pq.placeholder = T('pPlaceholder'); pq.setAttribute('aria-label', T('pLabel'));
    renderPlaces();
    q.placeholder = T('placeholder');
    q.setAttribute('aria-label', T('searchLabel'));
    chips.setAttribute('aria-label', T('channelsLabel'));
    document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    if (showingImport) showImport();
    else if (!birds.length) status.textContent = T('loading');
    else { buildChips(); updateSource(); render(); }
  }

  function buildChips(){
    chips.innerHTML = '';
    const mk = (label, value, n) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip';
      b.setAttribute('aria-pressed', String(activeChannel === value));
      b.innerHTML = (value ? `<span class="dot" style="background:${colorOf[value]}"></span>` : '') + esc(label) + ` <span class="n">${n}</span>`;
      b.onclick = () => { activeChannel = value; [...chips.children].forEach(x => x.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true'); render(); };
      chips.appendChild(b);
    };
    mk(T('all'), null, birds.length);
    channels.forEach(c => mk(canalLabel(c), c, counts[c]));
  }

  function updateSource(){
    const nSsp = birds.filter(isSsp).length;
    $('source').textContent = (sourceKey ? T(sourceKey) + ' · ' : '') + T('sourceCount')(birds.length - nSsp, nSsp);
    sspBox.closest('.opts').hidden = !nSsp;
  }

  function setData(data, key){
    if(!Array.isArray(data)) throw new Error('format');
    const list = data.filter(b => b && b[K_FR]);
    if(!list.length) throw new Error('vide');
    birds = list; sourceKey = key; showingImport = false;
    fuse = new Fuse(birds, { keys:[K_FR, K_SCI, K_EN], threshold:0.2, ignoreLocation:true });
    counts = {};
    birds.forEach(b => { const c = canalOf(b); counts[c] = (counts[c]||0)+1; });
    channels = Object.keys(counts).sort((a,b) => a.localeCompare(b,'fr'));
    colorOf = {}; channels.forEach((c,i) => colorOf[c] = COLORS[i % COLORS.length]);
    if (activeChannel && !counts[activeChannel]) activeChannel = null;
    q.disabled = false;
    buildChips(); updateSource(); render();
  }

  function render(){
    const raw = q.value.trim();
    const query = norm(raw);
    clearBtn.hidden = !raw;
    notice.innerHTML = '';

    let list, mode = 'all';
    if(!query){
      list = birds.slice();
    } else {
      const exact = birds.filter(b => [K_FR, K_SCI, K_EN].some(k => b[k] && norm(b[k]) === query));
      if(exact.length){ list = exact; mode = 'exact'; }
      else { list = fuse.search(raw).map(r => r.item); mode = 'fuzzy'; }
    }
    if(activeChannel) list = list.filter(b => canalOf(b) === activeChannel);
    if(!sspBox.checked && mode !== 'exact') list = list.filter(b => !isSsp(b));
    if(mode !== 'fuzzy') list.sort((a,b) => mainName(a).localeCompare(mainName(b), lang));

    // Le message « première pour l'île » n'apparaît qu'une fois la recherche validée (Entrée)
    if(mode === 'fuzzy' && submitted){
      notice.innerHTML = `<div class="notice"><p>${(list.length ? T('fuzzyNear') : T('fuzzyNone'))(esc(raw))}</p></div>`;
    }

    status.textContent = mode === 'exact' ? T('found')
      : mode === 'fuzzy' ? (list.length ? T('near')(list.length) : (submitted ? '' : T('noMatch')))
      : T('count')(list.length, !!activeChannel);

    if(!list.length){ results.innerHTML = ''; return; }
    results.innerHTML = '<ul class="list">' + list.map(b => {
      const c = canalOf(b), alt = altName(b);
      return `<li class="row">
        <span class="fr" lang="${lang === 'en' && b[K_EN] ? 'en' : 'fr'}">${highlight(mainName(b), raw)}${isSsp(b) ? `<span class="tag">${esc(T('ssp'))}</span>` : ''}</span>
        <span class="sci" lang="la">${highlight(b[K_SCI], raw)}</span>
        ${alt ? `<span class="en" lang="${lang === 'en' ? 'fr' : 'en'}">${highlight(alt, raw)}</span>` : ''}
        <span class="canal"><span class="dot" style="background:${colorOf[c]||'#5E676B'}"></span>${esc(canalLabel(c))}</span>
      </li>`;
    }).join('') + '</ul>';
  }

  function showImport(){
    showingImport = true;
    status.textContent = '';
    results.innerHTML = `<div class="empty">
      <h2>${esc(T('importTitle'))}</h2>
      <p>${T('importText')}</p>
      <label class="btn">${esc(T('importBtn'))}<input type="file" accept=".json,application/json" class="fileInput"></label>
    </div>`;
    bindFiles();
  }

  function bindFiles(){
    document.querySelectorAll('.fileInput').forEach(inp => inp.onchange = e => {
      const f = e.target.files && e.target.files[0]; if(!f) return;
      const r = new FileReader();
      r.onload = () => {
        try{
          const data = JSON.parse(r.result);
          setData(data, 'sourceFile');
          try{ localStorage.setItem(STORE, JSON.stringify(data)); }catch(_){}
        }catch(err){
          notice.innerHTML = `<div class="notice"><p>${esc(T('badFile'))}</p></div>`;
        }
      };
      r.readAsText(f);
      e.target.value = '';
    });
  }

      </div>`;
  }
  function placeMarks(p){ return p[5] ? [{ lat: p[2], lon: p[3], color: '#D62828' }] : []; }
  function redraw(li, p, extra){
    const view = li.querySelector('.pview');
    loadMap().then(img => drawPreview(view, p[1], img, placeMarks(p).concat(extra || [])), () => {});
  }
  function checkSuggestion(li, p, coords, how){
    const res = li.querySelector('.sresult');
    if (!coords){ res.innerHTML = `<p class="bad">${esc(T('badFormat'))}</p>`; return; }
    const [lat, lon] = coords, [x, y] = toPixel(lat, lon), cell = cellAt(x, y), z = zoneOf(p[1]);
    const inZone = cell && cell[0] >= z.c0 && cell[0] <= z.c1 && cell[1] >= z.r0 && cell[1] <= z.r1;
    if (!inZone){
      res.innerHTML = `<p class="bad">${esc(T('outZone')(cell ? cellName(cell) : null, p[0]))}</p>`;
      redraw(li, p); return;
    }
    const d = distM(p[2], p[3], lat, lon);
    const comment = li.querySelector('.scomment').value.trim();
    const prec = how && how.acc ? Math.max(10, Math.round(how.acc)) : 25;
    const newCell = cellName(cell), oldCells = p[1].join(', ');
    const cellsTxt = oldCells === newCell ? newCell : `${oldCells} → ${newCell}`;
    const line = JSON.stringify({ nom: p[0], carres: [newCell], lat: +lat.toFixed(5), lon: +lon.toFixed(5), precision_m: prec, verifie: true });
    let link;
    if (FORM){
      const href = formUrl({
        LIEU: p[0], CARRES: cellsTxt,
        ACTUELLE: `${p[2].toFixed(5)}, ${p[3].toFixed(5)}`,
        PROPOSEE: `${lat.toFixed(5)}, ${lon.toFixed(5)} (carré ${cellName(cell)}, à ${fmtDist(d)})`,
        METHODE: how && how.acc ? 'GPS du téléphone, précision ± ' + Math.round(how.acc) + ' m' : 'coordonnées saisies',
        COMMENTAIRE: comment, JSON: line
      });
      link = `<a class="smail" href="${esc(href)}" target="_blank" rel="noopener">${esc(T('sendForm'))}</a><p class="snote">${esc(T('formNote'))}</p>`;
    } else {
      link = `<p class="bad">${esc(T('sendOff'))}</p>`;
    }
    res.innerHTML = `<p class="good">${esc(T('okIn')(cellName(cell), fmtDist(d)))}</p>` + link;
    redraw(li, p, [{ lat, lon, color: '#1F7A5A' }]);
  }

  function togglePlace(li){
    const box = li.querySelector('.pmap'), btn = li.querySelector('.ptitle');
    const open = box.hidden;
    box.hidden = !open; btn.setAttribute('aria-expanded', String(open));
    if (!open) return;
    const p = shownPlaces[+li.dataset.i]; if (!p) return;
    const canSuggest = !(p[4] <= 50 && !p[5]);        // pas pour les phares, dont la position est déjà exacte
    box.innerHTML = `<div class="pview"><p>${esc(T('mapLoading'))}</p></div>` + (canSuggest ? `<div class="suggest">${suggestHtml()}</div>` : '');
    const view = box.querySelector('.pview');
    loadMap().then(img => drawPreview(view, p[1], img, placeMarks(p)), () => { view.innerHTML = `<p class="err">${esc(T('mapMissing'))}</p>`; });
  }

  presults.addEventListener('click', e => {
    const b = e.target.closest('button[data-copy]');
    if (!b) {
      const act = e.target.closest('[data-act]');
      if (act){
        const li = act.closest('.place'), p = shownPlaces[+li.dataset.i]; if (!p) return;
        const res = li.querySelector('.sresult');
        if (act.dataset.act === 'open'){
          const f = li.querySelector('.sform'); f.hidden = !f.hidden; act.setAttribute('aria-expanded', String(!f.hidden));
        } else if (act.dataset.act === 'check'){
          checkSuggestion(li, p, parseCoords(li.querySelector('.scoords').value));
        } else if (act.dataset.act === 'gps'){
          if (!navigator.geolocation){ res.innerHTML = `<p class="bad">${esc(T('gpsErr'))}</p>`; return; }
          res.innerHTML = `<p>${esc(T('gpsWait'))}</p>`;
          navigator.geolocation.getCurrentPosition(pos => {
            const { latitude, longitude, accuracy } = pos.coords;
            li.querySelector('.scoords').value = `${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;
            checkSuggestion(li, p, [latitude, longitude], { acc: accuracy });
            res.insertAdjacentHTML('afterbegin', `<p>${esc(T('gpsAcc')(Math.round(accuracy)))}</p>`);
          }, () => { res.innerHTML = `<p class="bad">${esc(T('gpsErr'))}</p>`; }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
        }
        return;
      }
      if (e.target.closest('.actions a, .pmap')) return;
      const li = e.target.closest('.place'); if (li) togglePlace(li);
      return;
    }
    const txt = b.dataset.copy;
    const done = () => { b.textContent = T('copied'); setTimeout(() => { b.textContent = T('copy'); }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, () => fallbackCopy(txt, done));
    else fallbackCopy(txt, done);
  });
  function fallbackCopy(txt, done){
    const ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly',''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch(_) {} ta.remove();
  }
  let pt;
  pq.addEventListener('input', () => { clearTimeout(pt); pt = setTimeout(renderPlaces, 100); });
  presults.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.classList.contains('scoords')){
      e.preventDefault(); const li = e.target.closest('.place'); const p = shownPlaces[+li.dataset.i];
      if (p) checkSuggestion(li, p, parseCoords(e.target.value));
    }
  });
  pq.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); renderPlaces(); pq.blur(); } });
  pclear.addEventListener('click', () => { pq.value = ''; renderPlaces(); pq.focus(); });

  function showTab(name){
    tab = name === 'places' ? 'places' : 'birds';
    document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
    $('tab-birds').hidden = tab !== 'birds';
    $('tab-places').hidden = tab !== 'places';
    document.querySelector('.lede').innerHTML = T(tab === 'places' ? 'ledePlaces' : 'lede');
    if (location.hash !== '#' + (tab === 'places' ? 'lieux' : 'oiseaux')) history.replaceState(null, '', '#' + (tab === 'places' ? 'lieux' : 'oiseaux'));
  }
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));

  let t;
  q.addEventListener('input', () => { submitted = false; clearTimeout(t); t = setTimeout(render, 120); });
  q.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); clearTimeout(t); submitted = !!q.value.trim(); render(); q.blur(); }
  });
  clearBtn.addEventListener('click', () => { q.value = ''; submitted = false; render(); q.focus(); });
  sspBox.addEventListener('change', render);
  document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => {
    lang = b.dataset.lang;
    try { localStorage.setItem(LANG_KEY, lang); } catch(_) {}
    applyLang();
  }));
  bindFiles();
  showTab(location.hash === '#lieux' ? 'places' : 'birds');
  applyLang();

  // 1) GitHub  2) copie enregistrée dans le navigateur  3) import manuel
  fetch(URL_DATA)
    .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(data => setData(data, 'sourceGithub'))
    .catch(() => {
      try{
        const saved = localStorage.getItem(STORE);
        if(saved){ setData(JSON.parse(saved), 'sourceSaved'); return; }
      }catch(_){}
      showImport();
    });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr" class="has-menu">
<head>
<meta charset="utf-8">
<!-- Page publique, en lecture seule : lit historique.json sur le site, rien n'est envoyé -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://raw.githubusercontent.com; font-src 'self'; connect-src 'self' https://api.open-meteo.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Historique · Oiseaux d'Ouessant</title>
<meta name="description" content="Tous les changements apportés aux espèces et aux lieux-dits de l'appli Oiseaux d'Ouessant, jour par jour.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/polices.css">
<link rel="stylesheet" href="css/commun.css">
<link rel="stylesheet" href="css/menu.css">
<link rel="stylesheet" href="css/phare.css">
<link rel="stylesheet" href="css/historique.css">
</head>
<body>
<div class="wrap">
  <header>
    <!-- bouton ☰ et phare : écrits ici pour être là dès l'affichage (js/menu.js et js/phare.js les font fonctionner) -->
    <button type="button" class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="menu" aria-label="Menu" title="Menu" data-notr><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="phare-wrap" data-notr>
      <button type="button" class="phare-btn" id="phareBtn" aria-expanded="false" aria-controls="pharePanel" aria-label="Météo et canaux" title="Météo et canaux"><img class="phare" src="phare_creach.svg" alt="" width="56" height="131"><span class="wind-pill" id="windPill" hidden></span></button>
      <div id="pharePanel" class="phare-panel" hidden></div>
    </div>
    <div class="intro">
      <h1 data-t="title">Historique</h1>
      <p class="sub" data-t="sub">Les changements apportés aux espèces et aux lieux-dits, jour par jour, et les nouveautés de chaque version de l’appli.</p>
    </div>
    <div class="hist-lang" role="group" aria-label="Langue / Language">
      <button type="button" data-lang="fr" aria-pressed="true">FR</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <nav class="hist-views" role="tablist" aria-label="Historique">
    <button type="button" role="tab" data-view="listes" aria-selected="true" data-t="tabLists">Listes</button>
    <button type="button" role="tab" data-view="versions" aria-selected="false" data-t="tabVersions">Versions de l’appli</button>
  </nav>
  <div class="hist-bar">
    <div class="hist-tabs" role="group" aria-label="Liste">
      <button type="button" data-f="" aria-pressed="true" data-t="all">Tout</button>
      <button type="button" data-f="ouessant_birds.json" aria-pressed="false" data-t="birds">Oiseaux</button>
      <button type="button" data-f="lieux_ouessant.json" aria-pressed="false" data-t="places">Lieux-dits</button>
    </div>
    <input type="search" id="histQ" autocomplete="off" spellcheck="false" data-t-ph="search" placeholder="Chercher une espèce ou un lieu-dit…" aria-label="Chercher une espèce ou un lieu-dit">
  </div>
  <p class="hist-note" data-t="note">Plusieurs changements d’un même champ dans la journée : seuls l’état du début et celui de la fin de journée sont montrés.</p>
  <div id="histList" aria-live="polite"></div>

  <p class="back"><a class="btn" href="index.html"><span aria-hidden="true">←</span> <span data-t="back">Revenir à l’appli</span></a></p>
</div>
<script src="js/version.js"></script>
<script src="js/textes.js"></script>
<script src="js/historique.js"></script>
<script src="js/historique-page.js"></script>
<script src="js/menu.js"></script>
<script src="js/phare.js"></script>
</body>
</html>
